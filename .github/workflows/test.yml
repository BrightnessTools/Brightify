name: Run pytest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    # Required for dorny/test-reporter to post comments/checks back to PRs
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install .

      - name: Run tests with pytest
        run: pytest --junitxml=reports/pytest-results.xml
      
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()  # Runs even if tests fail so you can see the report
        with:
          name: Pytest results
          path: reports/pytest-results.xml
          reporter: java-junit